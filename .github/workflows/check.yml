# Runs the same build and site checks as the deploy, without deploying.
# Catches broken links, bad JSON, and missing images before a PR is merged.

name: Check site

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build and check site
        run: python3 scripts/build.py
