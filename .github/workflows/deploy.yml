# .github/workflows/deploy.yml
# Deploys static site to GitHub Pages on every push to `main`.
# Build step (scripts/build.py): optimizes gallery images, regenerates gallery.json
# and sitemap.xml, stamps CSS/JS for cache busting, and runs site checks. A failed
# check stops the deploy.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so sitemap <lastmod> dates come from git

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build and check site
        run: python3 scripts/build.py --release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
